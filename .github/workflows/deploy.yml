name: Deploy

on:
  push:
    branches: [main]

jobs:
  db-migrate:
    name: Apply Supabase migrations
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Missing secret: SUPABASE_ACCESS_TOKEN"; exit 1; fi
          if [ -z "$SUPABASE_PROJECT_ID" ]; then echo "::error::Missing secret: SUPABASE_PROJECT_ID"; exit 1; fi

      - name: Apply pending migration SQL via Management API
        run: |
          for f in supabase/migrations/*.sql; do
            name=$(basename "$f")
            echo "--- $name ---"
            sql=$(cat "$f")
            payload=$(jq -n --arg q "$sql" '{query: $q}')
            response=$(curl -s -w "\n%{http_code}" \
              -X POST "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/database/query" \
              -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$payload")
            http_code=$(echo "$response" | tail -1)
            body=$(echo "$response" | head -n -1)
            if [ "$http_code" = "200" ] || [ "$http_code" = "201" ]; then
              echo "  ✓ applied"
            elif [ "$http_code" = "400" ]; then
              echo "  - already applied (or skip) — HTTP 400"
              echo "  $body" | head -c 300
              echo ""
            else
              echo "  ? HTTP $http_code"
              echo "  $body" | head -c 300
              echo ""
            fi
          done
